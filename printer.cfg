[include mainsail.cfg]
[include macros.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
rotation_distance: 40
microsteps: 16
endstop_pin: ^!PE5
position_min: 0
position_endstop: 0
position_max: 220
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 10

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
rotation_distance: 40
microsteps: 16
endstop_pin: ^!PL7
position_min: 0
position_endstop: 0
position_max: 220
homing_speed: 60
homing_retract_dist: 5
second_homing_speed: 10

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
rotation_distance: 8
microsteps: 16
endstop_pin: ^!PD3
position_min: 0
position_endstop: 0
position_max: 205
homing_speed: 7
homing_retract_dist: 5
second_homing_speed: 3

[stepper_z1]
step_pin: PC1
dir_pin: !PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PL6
#position_min: -2
#position_endstop: -2
#position_max: 205

[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
rotation_distance: 30.954
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
min_temp: 0
max_temp: 285
max_extrude_only_distance: 200.0
smooth_time: 1
min_extrude_temp: 180
max_extrude_cross_section: 150
#
control: pid
pid_Kp: 43.199
pid_Ki: 2.118
pid_Kd: 220.317

[verify_heater extruder]
check_gain_time: 60

[fan]
pin: PH6

[heater_fan extruder_fan]
pin: PL5

[controller_fan stepstick_fan]
pin: PH4

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
min_temp: 0
max_temp: 110
smooth_time: 1

control: pid
pid_Kp: 73.517
pid_Ki: 2.131
pid_Kd: 634.082

#[bltouch]
#sensor_pin: ^PE4
#control_pin: PB5
#x_offset: 29.7
#y_offset: -15.0
#stow_on_each_sample: False
#probe_with_touch_mode: True

[safe_z_home]
z_hop: 7
home_xy_position: 20,20

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 30, 14
mesh_max: 220,205
probe_count: 6
mesh_pps: 1
algorithm: bicubic
bicubic_tension: 0.3
adaptive_margin: 5

[respond]

[exclude_object]

[gcode_arcs]

[pause_resume]
recover_velocity: 180.0

[firmware_retraction]
retract_length: 1
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 25

[force_move]
enable_force_move: True

[virtual_sdcard]
path: /home/delagreen/printer_data/gcodes

# ====================================================================
# Display status (для отображения прогресса печати в интерфейсе)
# ====================================================================
[display_status]

# ====================================================================
# Макросы для управления печатью (PAUSE, RESUME, CANCEL_PRINT)
# ====================================================================

[gcode_macro PAUSE]
description: Pause the print
rename_existing: PAUSE_BASE
gcode:
  # Паркуем голову в безопасное положение (можно настроить под себя)
  SAVE_GCODE_STATE NAME=PAUSE_state
  SET_GCODE_OFFSET Z=0.0
  G91
  G1 Z5 F300
  G90
  G1 X5 Y5 F6000
  G91
  G1 E-2 F300
  G90
  RESPOND TYPE=command MSG="Печать приостановлена"

[gcode_macro RESUME]
description: Resume the print
rename_existing: RESUME_BASE
gcode:
  # Возвращаем голову на место
  G91
  G1 E2 F300
  G90
  RESTORE_GCODE_STATE NAME=PAUSE_state
  RESPOND TYPE=command MSG="Печать возобновлена"

[gcode_macro CANCEL_PRINT]
description: Cancel the print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  G91
  G1 Z5 F300
  G90
  G1 X0 Y210 F6000
  RESPOND TYPE=command MSG="Печать отменена"
  CLEAR_PAUSE