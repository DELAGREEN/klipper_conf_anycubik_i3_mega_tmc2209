#########################################################################
# Some configs from Mainsail docs
# See mainsail.cfg and the following link
# https://github.com/mainsail-crew/mainsail-config/blob/master/README.md
#########################################################################
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True              # use custom park coordinates for x,y [True/False] 
variable_custom_park_x    : 0                 # custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 210               # custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 10.0              # custom dz value; the value in mm to lift the nozzle when move to park position
variable_use_fw_retract   : False             # use fw_retraction instead of the manual version [True/False]
variable_retract          : 5.0               # the value to retract while PAUSE
variable_cancel_retract   : 6.0               # the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0              # retract speed in mm/s
variable_park_at_cancel   : True              # allow to move the toolhead to park while execute CANCEL_PRINT [True/False]

gcode:


######################################################################
# Emit a beep from the buzzer (_BEEPER_PIN) via GCODE
# https://github.com/jschuh/klipper-macros/blob/main/beep.cfg
######################################################################
[gcode_macro M300]
description: Emits and audible beep.
  Usage: M300 [P<duration>] [S<frequency>]
gcode:
  {% set settings = printer.configfile.settings %}
  {% if "output_pin _beeper" in printer %}
    {% set P = (params.P|default(100)|int, 0)|max %}
    {% set S = (params.S|default(1000)|int, 1)|max %}
    SET_PIN PIN=_beeper VALUE={% if settings["output_pin _beeper"].pwm %}{
      settings["output_pin _beeper"].scale|default(1.0) * 0.5} CYCLE_TIME={ 1.0 / S 
    }{% else %}1{% endif %}
    G4 P{P}
    SET_PIN PIN=_beeper VALUE=0
  {% else %}
    {action_respond_info(
       "M300 is disabled. To enable create an [output_pin _beeper] config.")}
  {% endif %}


[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(65)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(215)|float %}
    G90                                           # абсолютные координаты
    M83                                           # относительный экструдер
    M104 S{EXTRUDER_TEMP}                         # установка температуры хотэнда (без ожидания)
    M140 S{BED_TEMP}                              # установка температуры стола (без ожидания)
    G28                                           # хоминг всех осей
    # Z_TILT_ADJUST                               # убрано – если нет отдельного драйвера Z
    G1 X0 Y0 F10000                              # парковка в начальную точку (опционально)
    M190 S{BED_TEMP}                              # ожидание нагрева стола
    M109 S{EXTRUDER_TEMP}                         # ожидание нагрева хотэнда
    G92 E0.0                                      # обнуление экструдера
    LINE_PURGE                                    # очистка сопла (две линии)                               # zero extruded length again


######################################################################
# End Print
# Customized from:
# https://github.com/Klipper3d/klipper/blob/master/config/sample-macros.cfg
######################################################################
[gcode_macro PRINT_END]
gcode:
    {% set LIFT_NOZZLE = params.LIFT_NOZZLE|default(5)|float %}
    {% set MAX_Z = 205.0 %}
    {% set current_z = printer.toolhead.position.z %}
    {% set target_z = [current_z + LIFT_NOZZLE, MAX_Z] | min %}
    G91
    G1 X-2 Y-2 E-2 F1000
    M140 S0
    M104 S0
    M106 S0
    G90
    G1 Z{target_z} F3000      # подъём до рассчитанной высоты, но не выше MAX_Z
    G1 X0 Y210 F10000
    G92 E0.0
    G91
    G1 E-4 F1000
    G90
    G92 E0.0

######################################################################
# Filament Change; needs some adjustments.
# For example, it should use the _TOOLHEAD_PARK_PAUSE_CANCEL cmd
# from mainsail.cfg
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[gcode_macro M600]
gcode:
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 Z{Z} F300 
    G1 E-70 F1000
    RESTORE_GCODE_STATE NAME=M600_state


[gcode_macro UNLOAD_FILAMENT]
gcode:
    G92 E0.0       # zero extruded length
    G91
    G1 E-70 F500
    G90
    G92 E0.0       # zero extruded length


[gcode_macro LOAD_FILAMENT]
gcode:
    G92 E0.0       # zero extruded length
    G91
    G1 E70 F500
    G90
    G92 E0.0       # zero extruded length

[gcode_macro LINE_PURGE]
description: Печать двух линий по краю стола для удаления соплей
gcode:
    G91
    G1 Z5 F300                # поднять сопло на 5 мм
    G90
    G1 X5 Y5 F3000            # переместиться в левый передний угол
    G1 Z0.2 F300              # опустить сопло на высоту первого слоя
    G1 X205 E20 F1200         # первая линия → вправо (длина 200 мм, экструзия 20 мм)
    G1 Y6.5                   # сместиться на 1.5 мм по Y
    G1 X5 E20 F1200           # вторая линия ← влево
    G91
    G1 Z5 F300                # поднять сопло
    G90
    G1 X0 Y0 F10000           # уехать в стартовую позицию (или в парковку)
    G92 E0.0                  # обнулить экструдер